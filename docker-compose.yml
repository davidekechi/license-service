version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: sail
        uid: 1000
    image: license-service-app
    container_name: license-service-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    networks:
      - license-service-network
    depends_on:
      - postgres
      - redis
      - mailhog

  nginx:
    image: nginx:alpine
    container_name: license-service-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - license-service-network
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: license-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - license-service-network

  redis:
    image: redis:7-alpine
    container_name: license-service-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - license-service-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: license-service-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - license-service-network

networks:
  license-service-network:
    driver: bridge

# Add this at the bottom of the file
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vendor:                                  # ← ADD THIS
    driver: local